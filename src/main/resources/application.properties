server.port=${PORT:8080}
server.require-ssl=true
server.use-forward-headers=true

# OAuth2 Configuration for Production
spring.security.oauth2.client.registration.salesforce-prod.client-id=${SALESFORCE_CLIENT_ID:demo}
spring.security.oauth2.client.registration.salesforce-prod.client-secret=${SALESFORCE_CLIENT_SECRET:demo}
spring.security.oauth2.client.registration.salesforce-prod.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.salesforce-prod.redirect-uri={baseUrl}/login/oauth2/code/salesforce-prod
spring.security.oauth2.client.registration.salesforce-prod.scope=full,refresh_token
spring.security.oauth2.client.registration.salesforce-prod.client-name=Salesforce Production

# OAuth2 Configuration for Sandbox
spring.security.oauth2.client.registration.salesforce-sandbox.client-id=${SALESFORCE_SANDBOX_CLIENT_ID:${SALESFORCE_CLIENT_ID:demo}}
spring.security.oauth2.client.registration.salesforce-sandbox.client-secret=${SALESFORCE_SANDBOX_CLIENT_SECRET:${SALESFORCE_CLIENT_SECRET:demo}}
spring.security.oauth2.client.registration.salesforce-sandbox.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.salesforce-sandbox.redirect-uri={baseUrl}/login/oauth2/code/salesforce-sandbox
spring.security.oauth2.client.registration.salesforce-sandbox.scope=full,refresh_token
spring.security.oauth2.client.registration.salesforce-sandbox.client-name=Salesforce Sandbox

# OAuth2 Provider Configuration for Production
spring.security.oauth2.client.provider.salesforce-prod.authorization-uri=https://login.salesforce.com/services/oauth2/authorize
spring.security.oauth2.client.provider.salesforce-prod.token-uri=https://login.salesforce.com/services/oauth2/token
spring.security.oauth2.client.provider.salesforce-prod.user-info-uri=https://login.salesforce.com/services/oauth2/userinfo
spring.security.oauth2.client.provider.salesforce-prod.user-name-attribute=preferred_username

# OAuth2 Provider Configuration for Sandbox
spring.security.oauth2.client.provider.salesforce-sandbox.authorization-uri=https://test.salesforce.com/services/oauth2/authorize
spring.security.oauth2.client.provider.salesforce-sandbox.token-uri=https://test.salesforce.com/services/oauth2/token
spring.security.oauth2.client.provider.salesforce-sandbox.user-info-uri=https://test.salesforce.com/services/oauth2/userinfo
spring.security.oauth2.client.provider.salesforce-sandbox.user-name-attribute=preferred_username

# Session configuration
spring.session.store-type=none
server.servlet.session.timeout=30m