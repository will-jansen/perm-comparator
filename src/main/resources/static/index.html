<!DOCTYPE html>
<html>
<head>
    <title>Salesforce Permission Comparator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Salesforce Lightning Design System -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@salesforce-ux/design-system@2.25.1/assets/styles/salesforce-lightning-design-system.min.css">
    <script src="/javascripts/jquery-1.6.4.min.js"></script>
    
    <style>
        body { 
            background-color: #f3f3f3; 
            font-family: "Salesforce Sans", Arial, sans-serif;
        }
        .slds-scope .custom-header {
            background: linear-gradient(45deg, #1589ee, #0176d3);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
        }
        .slds-scope .custom-header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
        }
        .slds-scope .custom-header h2 {
            font-size: 1.125rem;
            font-weight: 400;
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }
        .slds-scope .login-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .slds-scope .demo-links {
            text-align: center;
            margin-top: 2rem;
        }
        .slds-scope .demo-links a {
            color: #0176d3;
            text-decoration: none;
        }
        .slds-scope .demo-links a:hover {
            text-decoration: underline;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="slds-scope">
        <!-- Header Section -->
        <div class="custom-header">
            <h1>PermComparator</h1>
            <h2>Compare Salesforce.com Users, Profiles, and Permission Sets</h2>
        </div>
        
        <!-- Main Container -->
        <div class="slds-container_center slds-container_medium slds-p-horizontal_medium">
            
            <!-- Login Section -->
            <div id="login-section" class="login-container">
                <div class="slds-card slds-p-around_large">
                    <div class="slds-text-align_center">
                        <div class="slds-illustration slds-illustration_small">
                            <div class="slds-m-bottom_medium">
                                <svg class="slds-illustration__svg" viewBox="0 0 454 280" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="height: 120px;">
                                    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                        <g transform="translate(-65.000000, -91.000000)">
                                            <g>
                                                <path d="M151.5,242 C144.5,242 139,236.5 139,229.5 C139,222.5 144.5,217 151.5,217 C158.5,217 164,222.5 164,229.5 C164,236.5 158.5,242 151.5,242 Z" fill="#1B96FF"></path>
                                                <path d="M182.5,242 C175.5,242 170,236.5 170,229.5 C170,222.5 175.5,217 182.5,217 C189.5,217 195,222.5 195,229.5 C195,236.5 189.5,242 182.5,242 Z" fill="#1B96FF"></path>
                                                <path d="M213.5,242 C206.5,242 201,236.5 201,229.5 C201,222.5 206.5,217 213.5,217 C220.5,217 226,222.5 226,229.5 C226,236.5 220.5,242 213.5,242 Z" fill="#1B96FF"></path>
                                            </g>
                                        </g>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        
                        <h3 class="slds-text-heading_medium slds-m-bottom_medium">Connect to Salesforce</h3>
                        <p class="slds-text-body_regular slds-m-bottom_large slds-text-color_weak">
                            Choose your Salesforce environment to begin comparing permissions
                        </p>
                        
                        <div class="slds-button-group" role="group">
                            <button id="login-production" class="slds-button slds-button_brand slds-button_stretch slds-m-right_small">
                                <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                                    <use xlink:href="#utility-world"></use>
                                </svg>
                                Login Production
                            </button>
                            <button id="login-sandbox" class="slds-button slds-button_outline-brand slds-button_stretch slds-m-left_small">
                                <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                                    <use xlink:href="#utility-preview"></use>
                                </svg>
                                Login Sandbox
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Authenticated Section -->
            <div id="authenticated-section" class="login-container hidden">
                <div class="slds-card">
                    <div class="slds-card__header slds-grid">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container slds-icon-utility-success" title="Connected">
                                    <svg class="slds-icon slds-icon_small" aria-hidden="true">
                                        <use xlink:href="#utility-success"></use>
                                    </svg>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_small">Salesforce Connection</span>
                                </h2>
                            </div>
                        </header>
                    </div>
                    <div class="slds-card__body slds-card__body_inner">
                        <div id="user-info"></div>
                    </div>
                    <div class="slds-card__footer">
                        <div class="slds-text-align_center">
                            <button id="logout-btn" class="slds-button slds-button_destructive">
                                <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                                    <use xlink:href="#utility-logout"></use>
                                </svg>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Help Links -->
            <div class="demo-links slds-m-top_large">
                <div class="slds-text-align_center">
                    <p class="slds-text-body_small slds-text-color_weak">
                        For additional information: <a href="https://github.com/will-jansen/perm-comparator" target="_blank">GitHub Wiki</a>
                    </p>
                    <p class="slds-text-body_small">
                        <strong>Login buttons not working?</strong> <a href="/setup.html">Click here for setup instructions</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
    function checkAuth() {
        $.get('/api/oauth/me')
            .done(function(data) {
                $('#login-section').addClass('hidden');
                $('#authenticated-section').removeClass('hidden');
                
                const username = data.principal?.preferred_username || data.principal?.name || 'Salesforce User';
                const instanceUrl = data.instanceUrl || data.principal?.instance_url || 'Unknown';
                const environment = data.client?.includes('sandbox') ? 'Sandbox' : 'Production';
                const orgId = data.principal?.organization_id || 'Unknown';
                
                $('#user-info').html(
                    '<div class="slds-grid slds-gutters">' +
                        '<div class="slds-col slds-size_1-of-1">' +
                            '<div class="slds-form-element">' +
                                '<label class="slds-form-element__label">Connected Environment</label>' +
                                '<div class="slds-form-element__control">' +
                                    '<span class="slds-badge slds-badge_success">Salesforce ' + environment + '</span>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="slds-col slds-size_1-of-1 slds-m-top_small">' +
                            '<dl class="slds-list_horizontal slds-wrap">' +
                                '<dt class="slds-item_label slds-text-color_weak slds-truncate" title="Username">Username:</dt>' +
                                '<dd class="slds-item_detail slds-truncate">' + username + '</dd>' +
                                '<dt class="slds-item_label slds-text-color_weak slds-truncate" title="Instance URL">Instance:</dt>' +
                                '<dd class="slds-item_detail slds-truncate">' + instanceUrl + '</dd>' +
                                '<dt class="slds-item_label slds-text-color_weak slds-truncate" title="Organization ID">Org ID:</dt>' +
                                '<dd class="slds-item_detail slds-truncate">' + orgId + '</dd>' +
                            '</dl>' +
                        '</div>' +
                    '</div>'
                );
            })
            .fail(function() {
                $('#login-section').removeClass('hidden');
                $('#authenticated-section').addClass('hidden');
            });
    }

    $(function() {
        checkAuth();
        
        // Handle login buttons - check configuration first
        $('#login-production').click(function() {
            console.log('Production login button clicked');
            // Check if OAuth2 is configured by trying to access the endpoint
            $.get('/api/oauth/config-check')
                .done(function(data) {
                    if (data.configured) {
                        window.location.href = '/oauth2/authorization/salesforce-prod';
                    } else {
                        showConfigurationError();
                    }
                })
                .fail(function() {
                    // If config check fails, try direct redirect anyway
                    window.location.href = '/oauth2/authorization/salesforce-prod';
                });
        });
        
        $('#login-sandbox').click(function() {
            console.log('Sandbox login button clicked');
            // Check if OAuth2 is configured by trying to access the endpoint
            $.get('/api/oauth/config-check')
                .done(function(data) {
                    if (data.configured) {
                        window.location.href = '/oauth2/authorization/salesforce-sandbox';
                    } else {
                        showConfigurationError();
                    }
                })
                .fail(function() {
                    // If config check fails, try direct redirect anyway
                    window.location.href = '/oauth2/authorization/salesforce-sandbox';
                });
        });
        
        function showConfigurationError() {
            // Show SLDS modal or alert for configuration
            if (!document.getElementById('config-modal')) {
                $('body').append(`
                    <div id="config-modal" class="slds-scope">
                        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container">
                                <header class="slds-modal__header">
                                    <h2 class="slds-text-heading_medium">Setup Required</h2>
                                </header>
                                <div class="slds-modal__content slds-p-around_medium">
                                    <p>OAuth2 configuration is required before you can login.</p>
                                    <p>You need to:</p>
                                    <ol class="slds-list_ordered slds-m-left_large">
                                        <li>Create a Salesforce Connected App</li>
                                        <li>Set SALESFORCE_CLIENT_ID and SALESFORCE_CLIENT_SECRET environment variables</li>
                                    </ol>
                                </div>
                                <footer class="slds-modal__footer">
                                    <button class="slds-button slds-button_neutral" onclick="closeConfigModal()">Close</button>
                                    <a href="/setup.html" class="slds-button slds-button_brand">Setup Instructions</a>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </div>
                `);
            }
            $('#config-modal').show();
        }
        
        window.closeConfigModal = function() {
            $('#config-modal').hide();
        };
        
        // Handle logout
        $('#logout-btn').click(function() {
            $.get('/api/oauth/logout').done(function() {
                window.location.href = '/logout';
            });
        });
        
        // Show error message if present in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            alert('Authentication failed. Please try again.');
        }
    });
    </script>
</body>
</html>
